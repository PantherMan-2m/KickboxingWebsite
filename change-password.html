<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Change password · CJN Boxing Academy</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="logo" href="/">🥊 CJN Boxing / Kick Boxing / Muay Thai </a>
  </div>
</header>

<main>
  <section class="container section" style="max-width:420px">
    <h2>Set a new password</h2>
    <p class="muted">Choose a new password for your account. At least 8 characters.</p>
    <form id="changePasswordForm" class="card form">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" name="newPassword" required minlength="8" autocomplete="new-password" />

      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" name="confirmPassword" required minlength="8" autocomplete="new-password" />

      <button class="btn" type="submit">Save password</button>
      <p class="form-status" id="formStatus" role="status"></p>
    </form>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© <span id="year"></span> CJN Boxing Academy · Somerset West, South Africa</p>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const status = document.getElementById('formStatus');
    const submitButton = form.querySelector('button[type="submit"]');

    if (form.newPassword.value !== form.confirmPassword.value) {
      status.textContent = 'Passwords do not match.';
      return;
    }

    status.textContent = 'Saving…';
    submitButton.disabled = true;

    try {
      const response = await fetch('/api/auth/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ newPassword: form.newPassword.value }),
      });
      const data = await response.json();

      if (!response.ok || !data.ok) {
        status.textContent = data.error || 'Could not update password. Please try again.';
        return;
      }

      status.textContent = 'Password updated. Redirecting…';
      window.location.href = data.user.role === 'coach' ? '/coach/dashboard.html' : '/student/dashboard.html';
    } catch (error) {
      status.textContent = 'Sorry, something went wrong. Please try again.';
    } finally {
      submitButton.disabled = false;
    }
  });
</script>
</body>
</html>
