<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My attendance · CJN Boxing Academy</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=5" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="logo" href="/">🥊 CJN Boxing / Kick Boxing / Muay Thai </a>
    <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="primary-nav">☰</button>
    <nav id="primary-nav" class="nav-links">
      <a href="/">Home</a>
      <a href="/student/dashboard.html">My attendance</a>
      <a href="/student/upcoming.html">Upcoming classes</a>
      <a href="#" id="logoutLink">Log out</a>
    </nav>
  </div>
</header>

<main>
  <section class="container section">
    <h2>My membership</h2>
    <div id="paymentsPanel" class="card">Loading…</div>
  </section>

  <section class="container section">
    <h2>My attendance</h2>
    <div class="scroll-x">
      <table class="schedule" id="attendanceTable">
        <thead><tr><th>Date</th><th>Class</th><th>Status</th></tr></thead>
        <tbody id="attendanceBody">
          <tr><td colspan="3">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© <span id="year"></span> CJN Boxing Academy · Somerset West, South Africa</p>
  </div>
</footer>

<script src="/app.js?v=3"></script>
<script>
  function paymentBadge(status) {
    const labels = { paid: 'Paid', overdue: 'Overdue', none: 'No plan' };
    return `<span class="pay-badge pay-badge--${status}">${labels[status] || labels.none}</span>`;
  }

  async function loadPayments() {
    const panel = document.getElementById('paymentsPanel');
    const { data } = await fetchJson('/api/student/payments');
    if (!data.ok) {
      panel.innerHTML = `<p class="muted">${escapeHtml(data.error || 'Could not load your membership.')}</p>`;
      return;
    }

    const planLine = data.plan
      ? `<p><strong>${escapeHtml(data.plan.name)}</strong> · ${formatRands(data.plan.effectivePriceCents)} ${paymentBadge(data.status)}</p>`
      : `<p class="muted">No plan on file. ${paymentBadge(data.status)}</p>`;

    const historyRows = data.payments.length
      ? data.payments
          .map(
            (p) => `
        <tr>
          <td>${p.paidOn}</td>
          <td>${p.planName ? escapeHtml(p.planName) : '—'}</td>
          <td>${formatRands(p.amountCents)}</td>
          <td>${p.method}</td>
          <td>${p.coversStart} – ${p.coversEnd}</td>
        </tr>
      `
          )
          .join('')
      : '<tr><td colspan="5" class="muted">No payments on file yet.</td></tr>';

    panel.innerHTML = `
      ${planLine}
      <div class="scroll-x">
        <table class="schedule">
          <thead><tr><th>Date</th><th>Plan</th><th>Amount</th><th>Method</th><th>Covers</th></tr></thead>
          <tbody>${historyRows}</tbody>
        </table>
      </div>
    `;
  }

  loadPayments();

  (async () => {
    const { data } = await fetchJson('/api/student/attendance');
    const body = document.getElementById('attendanceBody');
    if (!data.ok) {
      body.innerHTML = `<tr><td colspan="3">${escapeHtml(data.error || 'Could not load attendance.')}</td></tr>`;
      return;
    }
    if (data.attendance.length === 0) {
      body.innerHTML = '<tr><td colspan="3">No attendance recorded yet.</td></tr>';
      return;
    }
    body.innerHTML = data.attendance.map((a) => `
      <tr><td>${a.date}</td><td>${escapeHtml(a.name)}</td><td>${a.status}</td></tr>
    `).join('');
  })();
</script>
</body>
</html>
