<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upcoming classes · CJN Boxing Academy</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=4" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="logo" href="/">🥊 CJN Boxing / Kick Boxing / Muay Thai </a>
    <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="primary-nav">☰</button>
    <nav id="primary-nav" class="nav-links">
      <a href="/">Home</a>
      <a href="/student/dashboard.html">My attendance</a>
      <a href="/student/upcoming.html">Upcoming classes</a>
      <a href="#" id="logoutLink">Log out</a>
    </nav>
  </div>
</header>

<main>
  <section class="container section">
    <h2>Upcoming classes</h2>
    <p class="muted">The next 7 days. RSVP so your coach knows who's coming.</p>
    <p class="form-status" id="upcomingStatus" role="status"></p>
    <div class="scroll-x">
      <table class="schedule" id="upcomingTable">
        <thead>
          <tr><th>Date</th><th>Class</th><th>Time</th><th>Spots</th><th></th></tr>
        </thead>
        <tbody id="upcomingBody">
          <tr><td colspan="5">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© <span id="year"></span> CJN Boxing Academy · Somerset West, South Africa</p>
  </div>
</footer>

<script src="/app.js?v=2"></script>
<script>
  const upcomingBody = document.getElementById('upcomingBody');
  const upcomingStatus = document.getElementById('upcomingStatus');

  function renderUpcoming(list) {
    if (list.length === 0) {
      upcomingBody.innerHTML = '<tr><td colspan="5">No classes scheduled in the next 7 days.</td></tr>';
      return;
    }
    upcomingBody.innerHTML = list.map((c) => {
      const spotsText = c.capacity === null ? 'Unlimited' : `${Math.max(0, c.capacity - c.attending)} left`;
      // An already-going student always keeps a working cancel, even if the class
      // filled up after they RSVP'd -- only a non-going student is blocked.
      const blocked = c.full && !c.going;
      const label = c.going ? "Going ✓ (tap to cancel)" : (blocked ? 'Full' : "I'm going");
      return `
      <tr>
        <td>${c.date}</td>
        <td>${escapeHtml(c.name)}</td>
        <td>${c.startTime}${c.endTime ? ' - ' + c.endTime : ''}</td>
        <td>${spotsText}</td>
        <td><button class="btn btn-sm" data-template-id="${c.templateId}" data-date="${c.date}" data-going="${c.going ? '0' : '1'}" ${blocked ? 'disabled' : ''}>
          ${label}
        </button></td>
      </tr>
    `;
    }).join('');

    upcomingBody.querySelectorAll('button[data-template-id]:not([disabled])').forEach((btn) => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          const { data } = await fetchJson('/api/student/rsvp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              templateId: btn.dataset.templateId,
              date: btn.dataset.date,
              going: btn.dataset.going === '1',
            }),
          });
          if (!data.ok) {
            upcomingStatus.textContent = data.error || 'Could not update your RSVP.';
          } else {
            upcomingStatus.textContent = '';
          }
          await loadUpcoming();
        } finally {
          btn.disabled = false;
        }
      });
    });
  }

  async function loadUpcoming() {
    const { data } = await fetchJson('/api/student/upcoming');
    if (data.ok) {
      renderUpcoming(data.upcoming);
    } else {
      upcomingBody.innerHTML = `<tr><td colspan="5">${escapeHtml(data.error || 'Could not load upcoming classes.')}</td></tr>`;
    }
  }

  loadUpcoming();
</script>
</body>
</html>
