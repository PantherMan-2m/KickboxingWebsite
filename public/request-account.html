<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request an account · CJN Boxing Academy</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="logo" href="/">🥊 CJN Boxing / Kick Boxing / Muay Thai </a>
  </div>
</header>

<main>
  <section class="container section" style="max-width:420px">
    <h2>Request an account</h2>
    <form id="requestForm" class="card form">
      <label for="name">Name</label>
      <input id="name" type="text" name="name" required autocomplete="name" />

      <label for="email">Email</label>
      <input id="email" type="email" name="email" required autocomplete="email" />

      <button class="btn" type="submit">Request account</button>
      <p class="form-status" id="formStatus" role="status"></p>
    </form>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© <span id="year"></span> CJN Boxing Academy · Somerset West, South Africa</p>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  document.getElementById('requestForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const status = document.getElementById('formStatus');
    const submitButton = form.querySelector('button[type="submit"]');

    status.textContent = 'Sending…';
    submitButton.disabled = true;

    try {
      const response = await fetch('/api/auth/request-account', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: form.name.value,
          email: form.email.value,
        }),
      });
      const data = await response.json();

      if (!response.ok || !data.ok) {
        status.textContent = data.error || 'Something went wrong. Please try again.';
        submitButton.disabled = false;
        return;
      }

      status.textContent = 'Thanks -- a coach will review your request and email you login details.';
      form.reset();
      submitButton.disabled = true;
    } catch (error) {
      status.textContent = 'Sorry, something went wrong. Please try again.';
      submitButton.disabled = false;
    }
  });
</script>
</body>
</html>
