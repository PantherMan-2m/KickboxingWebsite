<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly schedule · CJN Boxing Academy</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=5" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="logo" href="/">🥊 CJN Boxing / Kick Boxing / Muay Thai </a>
    <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="primary-nav">☰</button>
    <nav id="primary-nav" class="nav-links">
      <a href="/">Home</a>
      <a href="/coach/dashboard.html">Dashboard</a>
      <a href="/coach/students.html">Students</a>
      <a href="/coach/requests.html">Requests</a>
      <a href="/coach/templates.html">Schedule</a>
      <a href="/coach/attendance.html">Attendance</a>
      <a href="/coach/payments.html">Payments</a>
      <a href="#" id="logoutLink">Log out</a>
    </nav>
  </div>
</header>

<main>
  <section class="container section">
    <h2>Add a recurring weekly class</h2>
    <form id="addTemplateForm" class="card form" style="max-width:420px">
      <label for="dayOfWeek">Day of week</label>
      <select id="dayOfWeek" name="dayOfWeek" required>
        <option value="0">Sunday</option>
        <option value="1">Monday</option>
        <option value="2">Tuesday</option>
        <option value="3">Wednesday</option>
        <option value="4">Thursday</option>
        <option value="5">Friday</option>
        <option value="6">Saturday</option>
      </select>

      <label for="startTime">Start time</label>
      <input id="startTime" type="time" name="startTime" required />

      <label for="endTime">End time (optional)</label>
      <input id="endTime" type="time" name="endTime" />

      <label for="name">Class name</label>
      <input id="name" type="text" name="name" required placeholder="All Levels" />

      <label for="capacity">Capacity (optional)</label>
      <input id="capacity" type="number" name="capacity" min="1" step="1" placeholder="Unlimited" />

      <button class="btn" type="submit">Add to schedule</button>
      <p class="form-status" id="formStatus" role="status"></p>
    </form>
  </section>

  <section class="container section">
    <h2>Current weekly schedule</h2>
    <p class="form-status" id="scheduleStatus" role="status"></p>
    <div class="scroll-x">
      <table class="schedule" id="templatesTable">
        <thead>
          <tr><th>Day</th><th>Time</th><th>Class</th><th>Capacity</th><th></th></tr>
        </thead>
        <tbody id="templatesBody">
          <tr><td colspan="5">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© <span id="year"></span> CJN Boxing Academy · Somerset West, South Africa</p>
  </div>
</footer>

<script src="/app.js?v=3"></script>
<script>
  const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const templatesBody = document.getElementById('templatesBody');
  const scheduleStatus = document.getElementById('scheduleStatus');

  async function loadTemplates() {
    const { data } = await fetchJson('/api/coach/templates');
    if (!data.ok) {
      templatesBody.innerHTML = `<tr><td colspan="5">${escapeHtml(data.error || 'Could not load schedule.')}</td></tr>`;
      return;
    }
    if (data.templates.length === 0) {
      templatesBody.innerHTML = '<tr><td colspan="5">No recurring classes set up yet.</td></tr>';
      return;
    }
    templatesBody.innerHTML = data.templates.map((t) => `
      <tr data-id="${t.id}">
        <td>${DAY_NAMES[t.day_of_week]}</td>
        <td>${t.start_time}${t.end_time ? ' - ' + t.end_time : ''}</td>
        <td>${escapeHtml(t.name)}</td>
        <td><input type="number" class="capacity-input" min="1" step="1" placeholder="Unlimited" value="${t.capacity ?? ''}" style="width:6em" /></td>
        <td><button class="btn btn-outline btn-sm capacity-save">Save</button></td>
      </tr>
    `).join('');

    templatesBody.querySelectorAll('tr[data-id]').forEach((row) => {
      row.querySelector('.capacity-save').addEventListener('click', async () => {
        const btn = row.querySelector('.capacity-save');
        const input = row.querySelector('.capacity-input');
        btn.disabled = true;
        scheduleStatus.textContent = 'Saving…';
        try {
          const { response, data } = await fetchJson(`/api/coach/templates/${row.dataset.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ capacity: input.value }),
          });
          if (!response?.ok || !data.ok) {
            scheduleStatus.textContent = data.error || 'Could not save capacity.';
            return;
          }
          scheduleStatus.textContent = 'Saved.';
          await loadTemplates();
        } finally {
          btn.disabled = false;
        }
      });
    });
  }

  document.getElementById('addTemplateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const status = document.getElementById('formStatus');
    const submitButton = form.querySelector('button[type="submit"]');

    status.textContent = 'Saving…';
    submitButton.disabled = true;

    try {
      const { response, data } = await fetchJson('/api/coach/templates', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          dayOfWeek: Number(form.dayOfWeek.value),
          startTime: form.startTime.value,
          endTime: form.endTime.value || undefined,
          name: form.name.value,
          capacity: form.capacity.value,
        }),
      });

      if (!response?.ok || !data.ok) {
        status.textContent = data.error || 'Could not save.';
        return;
      }

      status.textContent = 'Added.';
      form.reset();
      await loadTemplates();
    } catch (error) {
      status.textContent = 'Sorry, something went wrong. Please try again.';
    } finally {
      submitButton.disabled = false;
    }
  });

  loadTemplates();
</script>
</body>
</html>
