<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account requests · CJN Boxing Academy</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=4" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="logo" href="/">🥊 CJN Boxing / Kick Boxing / Muay Thai </a>
    <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="primary-nav">☰</button>
    <nav id="primary-nav" class="nav-links">
      <a href="/">Home</a>
      <a href="/coach/dashboard.html">Dashboard</a>
      <a href="/coach/students.html">Students</a>
      <a href="/coach/requests.html">Requests</a>
      <a href="/coach/templates.html">Schedule</a>
      <a href="/coach/attendance.html">Attendance</a>
      <a href="#" id="logoutLink">Log out</a>
    </nav>
  </div>
</header>

<main>
  <section class="container section">
    <h2>Account requests</h2>
    <p class="form-status" id="formStatus" role="status"></p>
    <div class="scroll-x">
      <table class="schedule" id="requestsTable">
        <thead>
          <tr><th>Name</th><th>Email</th><th>Requested</th><th></th></tr>
        </thead>
        <tbody id="requestsBody">
          <tr><td colspan="4">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© <span id="year"></span> CJN Boxing Academy · Somerset West, South Africa</p>
  </div>
</footer>

<script src="/app.js?v=2"></script>
<script>
  const requestsBody = document.getElementById('requestsBody');
  const formStatus = document.getElementById('formStatus');

  function renderRequests(requests) {
    if (requests.length === 0) {
      requestsBody.innerHTML = '<tr><td colspan="4">No pending requests.</td></tr>';
      return;
    }
    requestsBody.innerHTML = requests.map((r) => `
      <tr>
        <td>${escapeHtml(r.name)}</td>
        <td>${escapeHtml(r.email)}</td>
        <td>${new Date(r.created_at).toLocaleDateString()}</td>
        <td>
          <button class="btn btn-sm" data-id="${r.id}" data-action="approve">Approve</button>
          <button class="btn btn-outline btn-sm" data-id="${r.id}" data-action="reject">Reject</button>
        </td>
      </tr>
    `).join('');

    requestsBody.querySelectorAll('button[data-action]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          const { response, data } = await fetchJson(`/api/coach/requests/${btn.dataset.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: btn.dataset.action }),
          });

          if (!response?.ok || !data.ok) {
            formStatus.textContent = data.error || 'Could not update this request.';
            return;
          }

          if (btn.dataset.action === 'approve') {
            formStatus.textContent = data.emailSent
              ? 'Approved -- invite email sent.'
              : `Approved -- invite email failed to send. Temporary password: ${data.tempPassword} (share this with them directly).`;
          } else {
            formStatus.textContent = 'Request rejected.';
          }
          await loadRequests();
        } finally {
          btn.disabled = false;
        }
      });
    });
  }

  async function loadRequests() {
    const { data } = await fetchJson('/api/coach/requests');
    if (data.ok) {
      renderRequests(data.requests);
    } else {
      requestsBody.innerHTML = `<tr><td colspan="4">${escapeHtml(data.error || 'Could not load requests.')}</td></tr>`;
    }
  }

  loadRequests();
</script>
</body>
</html>
