<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coach dashboard · CJN Boxing Academy</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=4" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="logo" href="/">🥊 CJN Boxing / Kick Boxing / Muay Thai </a>
    <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="primary-nav">☰</button>
    <nav id="primary-nav" class="nav-links">
      <a href="/">Home</a>
      <a href="/coach/dashboard.html">Dashboard</a>
      <a href="/coach/students.html">Students</a>
      <a href="/coach/requests.html">Requests</a>
      <a href="/coach/templates.html">Schedule</a>
      <a href="/coach/attendance.html">Attendance</a>
      <a href="#" id="logoutLink">Log out</a>
    </nav>
  </div>
</header>

<main>
  <section class="container section">
    <h2>Next class</h2>
    <div id="nextClassPanel" class="card">Loading…</div>
  </section>

  <section class="container section">
    <h2>Coach dashboard</h2>
    <ul class="badges">
      <li><a href="/coach/students.html">Manage students</a></li>
      <li><a href="/coach/requests.html">Review account requests</a></li>
      <li><a href="/coach/templates.html">Weekly schedule</a></li>
      <li><a href="/coach/attendance.html">Mark attendance</a></li>
    </ul>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© <span id="year"></span> CJN Boxing Academy · Somerset West, South Africa</p>
  </div>
</footer>

<script src="/app.js?v=2"></script>
<script>
  async function loadNextClass() {
    const panel = document.getElementById('nextClassPanel');
    const { data } = await fetchJson('/api/coach/next-class');
    if (!data.ok) {
      panel.innerHTML = `<p class="muted">${escapeHtml(data.error || 'Could not load the next class.')}</p>`;
      return;
    }
    if (!data.nextClass) {
      panel.innerHTML = '<p class="muted">No classes scheduled in the next 7 days.</p>';
      return;
    }

    const c = data.nextClass;
    // capacity: null means unlimited -- render "N going", not "N / null".
    const attendingText = c.capacity === null
      ? `${c.attending} going`
      : `${c.attending} / ${c.capacity} going (${c.spotsRemaining} spot${c.spotsRemaining === 1 ? '' : 's'} left)`;

    panel.innerHTML = `
      <p><strong>${escapeHtml(c.name)}</strong></p>
      <p class="muted">${c.date}${c.startTime ? ' · ' + c.startTime : ''}${c.endTime ? ' - ' + c.endTime : ''}</p>
      <p>${attendingText}</p>
    `;
  }

  loadNextClass();
</script>
</body>
</html>
