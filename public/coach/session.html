<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mark attendance · CJN Boxing Academy</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=4" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="logo" href="/">🥊 CJN Boxing / Kick Boxing / Muay Thai </a>
    <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="primary-nav">☰</button>
    <nav id="primary-nav" class="nav-links">
      <a href="/">Home</a>
      <a href="/coach/dashboard.html">Dashboard</a>
      <a href="/coach/students.html">Students</a>
      <a href="/coach/requests.html">Requests</a>
      <a href="/coach/templates.html">Schedule</a>
      <a href="/coach/attendance.html">Attendance</a>
      <a href="#" id="logoutLink">Log out</a>
    </nav>
  </div>
</header>

<main>
  <section class="container section">
    <p><a href="/coach/attendance.html" id="backLink">&larr; Back to Attendance</a></p>
    <h2 id="sessionTitle">Loading…</h2>
    <p class="muted" id="sessionMeta"></p>
    <p class="muted" id="capacityMeta"></p>
    <form id="capacityForm" class="form" style="max-width:280px;display:none">
      <label for="capacityInput">Capacity override for this session (optional)</label>
      <input id="capacityInput" type="number" min="1" step="1" placeholder="Unlimited" />
      <button class="btn btn-outline btn-sm" type="submit">Save</button>
      <span class="form-status" id="capacityStatus" role="status"></span>
    </form>
  </section>

  <section class="container section">
    <div id="rosterContainer">Loading roster…</div>
    <p style="margin-top:16px">
      <button class="btn" id="saveButton">Save attendance</button>
      <span class="form-status" id="formStatus" role="status"></span>
    </p>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© <span id="year"></span> CJN Boxing Academy · Somerset West, South Africa</p>
  </div>
</footer>

<script src="/app.js?v=1"></script>
<script>
  const sessionId = new URLSearchParams(window.location.search).get('id');
  const rosterContainer = document.getElementById('rosterContainer');
  const statuses = ['present', 'absent', 'excused'];

  // Refreshes only the capacity display (used after saving the capacity override) --
  // deliberately does not touch rosterContainer, since re-rendering the roster would
  // discard any attendance selections the coach has made but not yet saved.
  async function refreshCapacityMeta() {
    const { data } = await fetchJson(`/api/coach/sessions/${sessionId}`);
    if (!data.ok) return;
    document.getElementById('capacityMeta').textContent =
      data.session.effectiveCapacity === null ? 'Capacity: unlimited' : `Capacity: ${data.session.effectiveCapacity}`;
    document.getElementById('capacityInput').value = data.session.capacity ?? '';
  }

  async function load() {
    if (!sessionId) {
      rosterContainer.innerHTML = '<p>No session specified.</p>';
      return;
    }
    const { data } = await fetchJson(`/api/coach/sessions/${sessionId}`);
    if (!data.ok) {
      rosterContainer.innerHTML = `<p>${data.error || 'Could not load session.'}</p>`;
      return;
    }

    document.getElementById('sessionTitle').textContent = data.session.name;
    document.getElementById('sessionMeta').textContent =
      `${data.session.date}${data.session.startTime ? ' · ' + data.session.startTime : ''}`;
    document.getElementById('backLink').href = `/coach/attendance.html?date=${data.session.date}`;

    document.getElementById('capacityMeta').textContent =
      data.session.effectiveCapacity === null ? 'Capacity: unlimited' : `Capacity: ${data.session.effectiveCapacity}`;
    document.getElementById('capacityInput').value = data.session.capacity ?? '';
    document.getElementById('capacityForm').style.display = '';

    if (data.roster.length === 0) {
      rosterContainer.innerHTML = '<p class="muted">No active students on the roster yet.</p>';
      return;
    }

    rosterContainer.innerHTML = `
      <div class="scroll-x">
      <table class="schedule">
        <thead><tr><th>Name</th><th>RSVP</th><th>Present</th><th>Absent</th><th>Excused</th></tr></thead>
        <tbody>
          ${data.roster.map((s) => `
            <tr data-user-id="${s.id}">
              <td>${escapeHtml(s.name)}</td>
              <td>${s.going ? '✓ Going' : ''}</td>
              ${statuses.map((st) => `
                <td style="text-align:center">
                  <input type="radio" name="status-${s.id}" value="${st}" ${s.status === st ? 'checked' : ''} />
                </td>
              `).join('')}
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
    `;
  }

  document.getElementById('capacityForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const capacityStatus = document.getElementById('capacityStatus');
    const submitButton = e.target.querySelector('button[type="submit"]');
    const input = document.getElementById('capacityInput');

    capacityStatus.textContent = 'Saving…';
    submitButton.disabled = true;

    try {
      const { response, data } = await fetchJson(`/api/coach/sessions/${sessionId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ capacity: input.value }),
      });

      if (!response?.ok || !data.ok) {
        capacityStatus.textContent = data.error || 'Could not save.';
        return;
      }

      capacityStatus.textContent = 'Saved.';
      await refreshCapacityMeta();
    } catch (error) {
      capacityStatus.textContent = 'Sorry, something went wrong. Please try again.';
    } finally {
      submitButton.disabled = false;
    }
  });

  document.getElementById('saveButton').addEventListener('click', async () => {
    const status = document.getElementById('formStatus');
    const saveButton = document.getElementById('saveButton');
    const rows = rosterContainer.querySelectorAll('tr[data-user-id]');

    const records = Array.from(rows).map((row) => {
      const userId = row.dataset.userId;
      const checked = row.querySelector('input[type="radio"]:checked');
      return { userId, status: checked ? checked.value : 'absent' };
    });

    status.textContent = 'Saving…';
    saveButton.disabled = true;

    try {
      const { data } = await fetchJson('/api/coach/mark-attendance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, records }),
      });
      status.textContent = data.ok ? 'Saved.' : (data.error || 'Could not save.');
    } catch (error) {
      status.textContent = 'Sorry, something went wrong. Please try again.';
    } finally {
      saveButton.disabled = false;
    }
  });

  load();
</script>
</body>
</html>
