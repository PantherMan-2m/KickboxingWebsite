<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upcoming classes · CJN Boxing Academy</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=4" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="logo" href="/">🥊 CJN Boxing / Kick Boxing / Muay Thai </a>
    <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="primary-nav">☰</button>
    <nav id="primary-nav" class="nav-links">
      <a href="/student/dashboard.html">My attendance</a>
      <a href="/student/upcoming.html">Upcoming classes</a>
      <a href="#" id="logoutLink">Log out</a>
    </nav>
  </div>
</header>

<main>
  <section class="container section">
    <h2>Upcoming classes</h2>
    <p class="muted">The next 7 days. RSVP so your coach knows who's coming.</p>
    <div class="scroll-x">
      <table class="schedule" id="upcomingTable">
        <thead>
          <tr><th>Date</th><th>Class</th><th>Time</th><th></th></tr>
        </thead>
        <tbody id="upcomingBody">
          <tr><td colspan="4">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© <span id="year"></span> CJN Boxing Academy · Somerset West, South Africa</p>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const navMenu = document.querySelector('.nav-links');
  const menuBtn = document.querySelector('.menu-toggle');
  menuBtn.addEventListener('click', () => {
    const isOpen = navMenu.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded', String(isOpen));
    document.body.classList.toggle('body-lock', isOpen);
  });
  document.querySelectorAll('.nav-links a').forEach((a) => {
    a.addEventListener('click', () => {
      navMenu.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
      document.body.classList.remove('body-lock');
    });
  });
  window.addEventListener('scroll', () => {
    if (navMenu.classList.contains('open')) {
      navMenu.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
      document.body.classList.remove('body-lock');
    }
  }, { passive: true });

  document.getElementById('logoutLink').addEventListener('click', async (e) => {
    e.preventDefault();
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = '/login.html';
  });

  const upcomingBody = document.getElementById('upcomingBody');

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderUpcoming(list) {
    if (list.length === 0) {
      upcomingBody.innerHTML = '<tr><td colspan="4">No classes scheduled in the next 7 days.</td></tr>';
      return;
    }
    upcomingBody.innerHTML = list.map((c) => `
      <tr>
        <td>${c.date}</td>
        <td>${escapeHtml(c.name)}</td>
        <td>${c.startTime}${c.endTime ? ' - ' + c.endTime : ''}</td>
        <td><button class="btn btn-sm" data-template-id="${c.templateId}" data-date="${c.date}" data-going="${c.going ? '0' : '1'}">
          ${c.going ? "Going ✓ (tap to cancel)" : "I'm going"}
        </button></td>
      </tr>
    `).join('');

    upcomingBody.querySelectorAll('button[data-template-id]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await fetch('/api/student/rsvp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              templateId: btn.dataset.templateId,
              date: btn.dataset.date,
              going: btn.dataset.going === '1',
            }),
          });
          await loadUpcoming();
        } finally {
          btn.disabled = false;
        }
      });
    });
  }

  async function loadUpcoming() {
    const response = await fetch('/api/student/upcoming');
    const data = await response.json();
    if (data.ok) renderUpcoming(data.upcoming);
  }

  loadUpcoming();
</script>
</body>
</html>
