<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My attendance · CJN Boxing Academy</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
</head>
<body>
<header class="site-header app">
  <div class="container nav">
    <a class="logo" href="/">🥊 CJN Boxing / Kick Boxing / Muay Thai </a>
    <nav class="nav-links">
      <a href="#" id="logoutLink">Log out</a>
    </nav>
  </div>
</header>

<main>
  <section class="container section">
    <h2>My attendance</h2>
    <div class="scroll-x">
      <table class="schedule" id="attendanceTable">
        <thead><tr><th>Date</th><th>Class</th><th>Status</th></tr></thead>
        <tbody id="attendanceBody">
          <tr><td colspan="3">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© <span id="year"></span> CJN Boxing Academy · Somerset West, South Africa</p>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  document.getElementById('logoutLink').addEventListener('click', async (e) => {
    e.preventDefault();
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = '/login.html';
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  (async () => {
    const response = await fetch('/api/student/attendance');
    const data = await response.json();
    const body = document.getElementById('attendanceBody');
    if (!data.ok || data.attendance.length === 0) {
      body.innerHTML = '<tr><td colspan="3">No attendance recorded yet.</td></tr>';
      return;
    }
    body.innerHTML = data.attendance.map((a) => `
      <tr><td>${a.date}</td><td>${escapeHtml(a.name)}</td><td>${a.status}</td></tr>
    `).join('');
  })();
</script>
</body>
</html>
